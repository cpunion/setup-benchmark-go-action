name: Render Go benchmark history
description: Aggregate validated platform artifacts and render history and a PR report.

inputs:
  artifacts:
    description: Directory containing downloaded benchmark artifacts.
    required: true
  data-directory:
    description: Checked-out benchmark data branch.
    required: true
  trusted-config:
    description: Optional trusted configuration used to verify artifact configuration.
    default: ""
  series-kind:
    description: main, branch, or pull.
    required: true
  series-id:
    description: Stable series identifier.
    required: true
  series-label:
    description: Series display label.
    required: true
  additional-series-kind:
    description: Optional second series kind for the same benchmark result.
    default: ""
  additional-series-id:
    description: Optional second series identifier.
    default: ""
  additional-series-label:
    description: Optional second series display label.
    default: ""
  site-base-url:
    description: GitHub Pages root URL.
    default: ""
  expected-source-repository:
    description: Repository identity required in every downloaded artifact.
    default: ""
  expected-source-sha:
    description: Commit identity required in every downloaded artifact.
    default: ""
  source-ref:
    description: Trusted source ref stored in history.
    default: ""
  source-url:
    description: Trusted source commit URL stored in history.
    default: ""
  source-run-url:
    description: Trusted source workflow URL stored in history.
    default: ""
  source-timestamp:
    description: Trusted source workflow timestamp stored in history.
    default: ""
  comment-path:
    description: Output path for the generated Markdown report.
    required: true

outputs:
  comment-path:
    description: Generated Markdown report.
    value: ${{ steps.render.outputs.comment-path }}
  marker:
    description: Stable marker used to update one PR comment.
    value: ${{ steps.render.outputs.marker }}
  site-path:
    description: Generated site directory.
    value: ${{ steps.render.outputs.site-path }}
  site-url:
    description: URL for the selected benchmark series.
    value: ${{ steps.render.outputs.site-url }}
  suite-id:
    description: Benchmark suite ID.
    value: ${{ steps.render.outputs.suite-id }}

runs:
  using: composite
  steps:
    - id: render
      name: Aggregate and render benchmarks
      uses: actions/github-script@v8
      env:
        BENCHMARK_ACTION_ENTRY: ${{ github.action_path }}/dist/index.js
        BENCHMARK_ARTIFACTS: ${{ inputs.artifacts }}
        BENCHMARK_DATA_DIRECTORY: ${{ inputs.data-directory }}
        BENCHMARK_TRUSTED_CONFIG: ${{ inputs.trusted-config }}
        BENCHMARK_SERIES_KIND: ${{ inputs.series-kind }}
        BENCHMARK_SERIES_ID: ${{ inputs.series-id }}
        BENCHMARK_SERIES_LABEL: ${{ inputs.series-label }}
        BENCHMARK_ADDITIONAL_SERIES_KIND: ${{ inputs.additional-series-kind }}
        BENCHMARK_ADDITIONAL_SERIES_ID: ${{ inputs.additional-series-id }}
        BENCHMARK_ADDITIONAL_SERIES_LABEL: ${{ inputs.additional-series-label }}
        BENCHMARK_SITE_BASE_URL: ${{ inputs.site-base-url }}
        BENCHMARK_EXPECTED_SOURCE_REPOSITORY: ${{ inputs.expected-source-repository }}
        BENCHMARK_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        BENCHMARK_SOURCE_REF: ${{ inputs.source-ref }}
        BENCHMARK_SOURCE_URL: ${{ inputs.source-url }}
        BENCHMARK_SOURCE_RUN_URL: ${{ inputs.source-run-url }}
        BENCHMARK_SOURCE_TIMESTAMP: ${{ inputs.source-timestamp }}
        BENCHMARK_COMMENT_PATH: ${{ inputs.comment-path }}
      with:
        script: |
          const action = require(process.env.BENCHMARK_ACTION_ENTRY);
          action.run();
