id: setup-benchmark-go-action
title: setup-benchmark-go-action
groups:
  parsing: "^Parse"
  grouping: "^Group"
  validation: "^Validate"
  bundles:
    match: "Bundle$"
    chart: single
views:
  bundles:
    title: Action bundle sizes
    select:
      groups: "^bundles$"
    table:
      rows: [benchmark]
      columns: [metric]
      missing: error
      dimensions:
        benchmark:
          title: Bundle
          trim-prefix: Benchmark
      metrics:
        binary-bytes:
          title: Size
          format: bytes
  operations:
    title: Parser and validation operations
    select:
      groups: "^(parsing|grouping|validation)$"
    table:
      rows: [group, benchmark]
      columns: [metric]
      collapsed: true
      missing: error
      dimensions:
        benchmark:
          trim-prefix: Benchmark
      metrics:
        ns/op:
          title: Median time
