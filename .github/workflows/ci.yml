name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: true
      - run: npm ci
      - name: Check source
        run: npm run check
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Verify bundled action
        run: |
          npm run build
          git diff --exit-code -- dist publish/dist
