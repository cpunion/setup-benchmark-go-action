name: Go benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run self benchmarks
        run: node scripts/benchmark.js | tee benchmark.txt
      - uses: ./
        with:
          config: .github/go-benchmark.yml
          benchmark-file: benchmark.txt
          platform-id: ubuntu-node24-amd64
          platform-label: Ubuntu / amd64 / Node 24

  publish:
    if: github.event_name == 'push'
    needs: benchmark
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ github.run_id }}
      source_mode: current-run
