name: Go benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run selected benchmarks
        env:
          GOMAXPROCS: "2"
        run: |
          go test -p=1 \
            -run '^$' \
            -bench '^(BenchmarkParseGoOutput|BenchmarkGroupRules|BenchmarkValidateArtifact)$' \
            -benchmem \
            -benchtime=200ms \
            -count=5 \
            -cpu=1 \
            ./internal/config ./internal/gobench ./internal/store \
            | tee benchmark.txt
      - uses: cpunion/setup-benchmark-go-action@main
        with:
          config: .github/go-benchmark.yml
          benchmark-file: benchmark.txt
