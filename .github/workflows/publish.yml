name: Publish Go benchmarks

on:
  workflow_call:
    inputs:
      run_id:
        description: Workflow run containing go-benchmark-* artifacts.
        required: true
        type: number
      data_repository:
        description: Repository that stores the Pages branch. Defaults to the source repository.
        default: ""
        type: string
      data_branch:
        description: Data and Pages branch.
        default: pages
        type: string
      data_dispatch_event:
        description: Optional repository_dispatch event sent after data is ready.
        default: ""
        type: string
      site_base_url:
        description: Optional Pages root URL.
        default: ""
        type: string
      artifact_pattern:
        description: Benchmark artifact pattern.
        default: go-benchmark-*
        type: string
      config_path:
        description: Benchmark configuration path on the default branch.
        default: .github/go-benchmark.yml
        type: string
    secrets:
      data_token:
        description: Token with contents write access when data_repository is external.
        required: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: go-benchmark-data-${{ inputs.data_repository || github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Classify source series
        id: source
        env:
          CONFIGURED_DATA_REPOSITORY: ${{ inputs.data_repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data_repository="$CONFIGURED_DATA_REPOSITORY"
          [[ -n "$data_repository" ]] || data_repository="$GITHUB_REPOSITORY"
          if [[ ! "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid benchmark source repository: ${HEAD_REPOSITORY:-missing}" >&2
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid benchmark source commit: ${HEAD_SHA:-missing}" >&2
            exit 1
          fi
          if [[ -z "$HEAD_BRANCH" ]]; then
            echo "missing benchmark source branch" >&2
            exit 1
          fi

          same_repository=false
          [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]] || same_repository=true
          if [[ "$RUN_EVENT" == pull_request ]]; then
            if [[ -z "$PR_NUMBER" ]]; then
              head_owner="${HEAD_REPOSITORY%%/*}"
              PR_NUMBER="$(
                gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
                  -f state=open \
                  -f "head=${head_owner}:${HEAD_BRANCH}" \
                  --jq '[.[] | select(
                    .head.repo.full_name == env.HEAD_REPOSITORY and
                    .head.ref == env.HEAD_BRANCH and
                    .head.sha == env.HEAD_SHA
                  )][0].number // empty'
              )"
            fi
            if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "cannot resolve pull request for $HEAD_SHA" >&2
              exit 1
            fi
            kind=pull
            id="$PR_NUMBER"
            label="PR #$PR_NUMBER"
          elif [[ "$RUN_EVENT" == push && "$HEAD_BRANCH" == "$DEFAULT_BRANCH" ]]; then
            kind=main
            id=main
            label=Main
          else
            kind=branch
            id="$(printf '%s' "$HEAD_BRANCH" | sha256sum | cut -c1-16)"
            label="Branch $HEAD_BRANCH"
          fi
          publish="$same_repository"
          [[ "$kind" != pull ]] || publish=true
          branch_seed="$HEAD_BRANCH"
          branch_label="Branch $HEAD_BRANCH"
          if [[ "$same_repository" != true ]]; then
            branch_seed="${HEAD_REPOSITORY}:${HEAD_BRANCH}"
            branch_label="Branch $branch_seed"
          fi
          branch_id="$(printf '%s' "$branch_seed" | sha256sum | cut -c1-16)"

          {
            echo "publish=$publish"
            echo "same-repository=$same_repository"
            echo "kind=$kind"
            echo "id=$id"
            echo "label=$label"
            echo "pr=$PR_NUMBER"
            if [[ "$kind" == pull ]]; then
              echo "additional-kind=branch"
              echo "additional-id=$branch_id"
              echo "additional-label=$branch_label"
            fi
            echo "data-repository=$data_repository"
            if [[ "$data_repository" == "$GITHUB_REPOSITORY" ]]; then
              echo "same-data-repository=true"
            else
              echo "same-data-repository=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: benchmark-artifacts
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check out trusted benchmark configuration for fork
        if: >-
          steps.source.outputs.kind == 'pull' &&
          steps.source.outputs.same-repository != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: benchmark-source
          persist-credentials: false
          sparse-checkout: ${{ inputs.config_path }}
          sparse-checkout-cone-mode: false

      - name: Check benchmark data write access
        id: data-access
        env:
          DATA_TOKEN: ${{ secrets.data_token }}
          PUBLISH: ${{ steps.source.outputs.publish }}
          SAME_DATA_REPOSITORY: ${{ steps.source.outputs.same-data-repository }}
        run: |
          set -euo pipefail
          writable=false
          if [[ "$PUBLISH" == true ]] &&
            [[ "$SAME_DATA_REPOSITORY" == true || -n "$DATA_TOKEN" ]]; then
            writable=true
          fi
          echo "writable=$writable" >> "$GITHUB_OUTPUT"

      - name: Check out writable benchmark data
        id: data-checkout
        if: steps.data-access.outputs.writable == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.data-repository }}
          path: benchmark-data
          token: >-
            ${{ steps.source.outputs.same-data-repository == 'true' &&
                github.token || secrets.data_token }}
          fetch-depth: 1

      - name: Check out public benchmark data for preview
        id: preview-data
        if: steps.data-checkout.outcome != 'success'
        env:
          DATA_REPOSITORY: ${{ steps.source.outputs.data-repository }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/benchmark-data"
          if git clone --depth=1 "https://github.com/$DATA_REPOSITORY.git" benchmark-data; then
            echo "history-loaded=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf "$GITHUB_WORKSPACE/benchmark-data"
            mkdir benchmark-data
            git -C benchmark-data init
            git -C benchmark-data remote add origin "https://github.com/$DATA_REPOSITORY.git"
            echo "history-loaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select data branch
        working-directory: benchmark-data
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
        run: |
          set -euo pipefail
          if git fetch origin "refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"; then
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -rf --ignore-unmatch .
          fi

      - name: Resolve Pages URL
        id: pages
        run: |
          set -euo pipefail
          if [[ "$HISTORY_AVAILABLE" != true ]]; then
            url=""
          elif [[ -n "$CONFIGURED_URL" ]]; then
            url="${CONFIGURED_URL%/}"
          else
            owner="${DATA_REPOSITORY%%/*}"
            repository="${DATA_REPOSITORY#*/}"
            if [[ "$repository" == "$owner.github.io" ]]; then
              url="https://$owner.github.io"
            else
              url="https://$owner.github.io/$repository"
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CONFIGURED_URL: ${{ inputs.site_base_url }}
          DATA_REPOSITORY: ${{ steps.source.outputs.data-repository }}
          HISTORY_AVAILABLE: >-
            ${{ steps.data-checkout.outcome == 'success' ||
                steps.preview-data.outputs.history-loaded == 'true' }}

      - name: Render benchmark history
        id: render
        uses: xgo-dev/setup-benchmark-go-action/publish@v1.0.3
        with:
          artifacts: benchmark-artifacts
          data-directory: benchmark-data
          trusted-config: >-
            ${{ steps.source.outputs.same-repository != 'true' &&
                format('benchmark-source/{0}', inputs.config_path) || '' }}
          series-kind: ${{ steps.source.outputs.kind }}
          series-id: ${{ steps.source.outputs.id }}
          series-label: ${{ steps.source.outputs.label }}
          additional-series-kind: ${{ steps.source.outputs.additional-kind }}
          additional-series-id: ${{ steps.source.outputs.additional-id }}
          additional-series-label: ${{ steps.source.outputs.additional-label }}
          site-base-url: ${{ steps.pages.outputs.url }}
          expected-source-repository: ${{ github.event.workflow_run.head_repository.full_name }}
          expected-source-sha: ${{ github.event.workflow_run.head_sha }}
          source-ref: ${{ github.event.workflow_run.head_branch }}
          source-url: >-
            ${{ format(
                '{0}/{1}/commit/{2}',
                github.server_url,
                github.event.workflow_run.head_repository.full_name,
                github.event.workflow_run.head_sha) }}
          source-run-url: >-
            ${{ format(
                '{0}/{1}/actions/runs/{2}',
                github.server_url,
                github.repository,
                inputs.run_id) }}
          source-timestamp: >-
            ${{ github.event.workflow_run.run_started_at ||
                github.event.workflow_run.created_at }}
          comment-path: ${{ runner.temp }}/go-benchmark-comment.md

      - name: Commit benchmark data
        id: data-publish
        if: steps.data-checkout.outcome == 'success'
        continue-on-error: true
        working-directory: benchmark-data
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          SERIES_KIND: ${{ steps.source.outputs.kind }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$SERIES_KIND" == pull ]]; then
            current_head="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha
            )"
            if [[ "$current_head" != "$SOURCE_SHA" ]]; then
              echo "skip stale benchmark data for $SOURCE_SHA; pull request is at $current_head"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "benchmarks: update ${SOURCE_SHA:0:12}"
          git push origin "HEAD:$DATA_BRANCH"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Notify benchmark data repository
        id: data-dispatch
        if: >-
          steps.data-publish.outcome == 'success' &&
          steps.data-publish.outputs.ready == 'true' &&
          inputs.data_dispatch_event != ''
        continue-on-error: true
        env:
          DATA_BRANCH: ${{ inputs.data_branch }}
          DATA_REPOSITORY: ${{ steps.source.outputs.data-repository }}
          DISPATCH_EVENT: ${{ inputs.data_dispatch_event }}
          GH_TOKEN: >-
            ${{ steps.source.outputs.same-data-repository == 'true' &&
                github.token || secrets.data_token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_URL: >-
            ${{ format(
                '{0}/{1}/actions/runs/{2}',
                github.server_url,
                github.repository,
                inputs.run_id) }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          jq -cn \
            --arg event_type "$DISPATCH_EVENT" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_run_url "$SOURCE_RUN_URL" \
            --arg data_branch "$DATA_BRANCH" \
            '{
              event_type: $event_type,
              client_payload: {
                source_repository: $source_repository,
                source_sha: $source_sha,
                source_run_url: $source_run_url,
                data_branch: $data_branch
              }
            }' |
            gh api --method POST "repos/${DATA_REPOSITORY}/dispatches" --input -

      - name: Add publishing status to report
        env:
          COMMENT_PATH: ${{ steps.render.outputs.comment-path }}
          DATA_CHECKOUT_OUTCOME: ${{ steps.data-checkout.outcome }}
          DATA_DISPATCH_EVENT: ${{ inputs.data_dispatch_event }}
          DATA_DISPATCH_OUTCOME: ${{ steps.data-dispatch.outcome }}
          DATA_PUBLISH_OUTCOME: ${{ steps.data-publish.outcome }}
          DATA_PUBLISH_READY: ${{ steps.data-publish.outputs.ready }}
          HISTORY_LOADED: ${{ steps.preview-data.outputs.history-loaded }}
          PUBLISH: ${{ steps.source.outputs.publish }}
          WRITE_CONFIGURED: ${{ steps.data-access.outputs.writable }}
        run: |
          set -euo pipefail
          warnings=()
          if [[ "$PUBLISH" == true ]]; then
            if [[ "$WRITE_CONFIGURED" != true ]]; then
              warnings+=(
                "Persistent publishing is unavailable because no data token is configured."
              )
            elif [[ "$DATA_CHECKOUT_OUTCOME" != success ]]; then
              warnings+=(
                "Persistent publishing is unavailable because the data repository could not be checked out for writing."
              )
            elif [[ "$DATA_PUBLISH_OUTCOME" != success ]]; then
              warnings+=(
                "The rendered benchmark data could not be pushed."
              )
            elif [[ -n "$DATA_DISPATCH_EVENT" ]] &&
              [[ "$DATA_PUBLISH_READY" == true ]] &&
              [[ "$DATA_DISPATCH_OUTCOME" != success ]]; then
              warnings+=(
                "Benchmark data was saved, but the Pages deployment notification failed."
              )
            fi
          fi
          if [[ "$DATA_CHECKOUT_OUTCOME" != success ]] &&
            [[ "$HISTORY_LOADED" != true ]]; then
            warnings+=(
              "Existing benchmark history was unavailable, so this preview starts with an empty history."
            )
          fi
          if ((${#warnings[@]} == 0)); then
            exit 0
          fi
          {
            echo
            echo "> [!WARNING]"
            for warning in "${warnings[@]}"; do
              printf "> - %s\n" "$warning"
            done
          } >> "$COMMENT_PATH"

      - name: Upload rendered preview
        uses: actions/upload-artifact@v7
        with:
          name: go-benchmark-preview-${{ steps.render.outputs.suite-id }}
          path: |
            ${{ steps.render.outputs.site-path }}
            ${{ steps.render.outputs.comment-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Add report to job summary
        env:
          COMMENT_PATH: ${{ steps.render.outputs.comment-path }}
        run: cat "$COMMENT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update PR comment
        if: steps.source.outputs.kind == 'pull'
        uses: actions/github-script@v8
        env:
          COMMENT_PATH: ${{ steps.render.outputs.comment-path }}
          COMMENT_MARKER: ${{ steps.render.outputs.marker }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require("fs");
            const issue_number = Number(process.env.PR_NUMBER);
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
            });
            if (pull.data.head.sha !== process.env.SOURCE_SHA) {
              core.info(
                `Skip stale benchmark comment for ${process.env.SOURCE_SHA}; ` +
                `pull request is at ${pull.data.head.sha}.`
              );
              return;
            }
            const body = fs.readFileSync(process.env.COMMENT_PATH, "utf8");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === "Bot" &&
              comment.body.includes(process.env.COMMENT_MARKER)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
