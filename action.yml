name: Setup Benchmark Go
author: cpunion
description: Parse, group, and publish Go benchmark history from GitHub Actions.

inputs:
  config:
    description: Path to the benchmark grouping configuration.
    default: .github/go-benchmark.yml
  benchmark-file:
    description: Path to go test -bench output.
    required: true
  platform-id:
    description: Stable platform ID. Defaults to GOOS-GOARCH.
    default: ""
  platform-label:
    description: Platform label. Defaults to the benchmark OS and architecture.
    default: ""
  shard-id:
    description: Stable shard ID. Defaults to the current GitHub job ID.
    default: ""
  retention-days:
    description: Artifact retention in days.
    default: "30"

outputs:
  artifact-name:
    description: Uploaded artifact name.
    value: ${{ steps.record.outputs.artifact-name }}
  platform-id:
    description: Recorded platform ID.
    value: ${{ steps.record.outputs.platform-id }}
  shard-id:
    description: Recorded shard ID.
    value: ${{ steps.record.outputs.shard-id }}
  suite-id:
    description: Benchmark suite ID.
    value: ${{ steps.record.outputs.suite-id }}

runs:
  using: composite
  steps:
    - id: record
      name: Parse Go benchmark output
      uses: actions/github-script@v8
      env:
        BENCHMARK_ACTION_ENTRY: ${{ github.action_path }}/dist/index.js
        BENCHMARK_CONFIG: ${{ inputs.config }}
        BENCHMARK_BENCHMARK_FILE: ${{ inputs.benchmark-file }}
        BENCHMARK_PLATFORM_ID: ${{ inputs.platform-id }}
        BENCHMARK_PLATFORM_LABEL: ${{ inputs.platform-label }}
        BENCHMARK_SHARD_ID: ${{ inputs.shard-id }}
      with:
        script: |
          const action = require(process.env.BENCHMARK_ACTION_ENTRY);
          action.run();

    - name: Upload Go benchmark artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.record.outputs.artifact-name }}
        path: ${{ steps.record.outputs.artifact-path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

branding:
  icon: activity
  color: blue
